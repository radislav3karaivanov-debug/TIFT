<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFT | The Invincible Fog Technology</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        board: {
                            bg: '#0B1120',
                            card: '#111827',
                            border: '#1E293B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Subtle pulsing indicator for live telemetry */
        @keyframes pulse-ring {
            0% { transform: scale(0.85); opacity: 0.85; }
            100% { transform: scale(2.3); opacity: 0; }
        }
        .live-pulse::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background-color: #10B981;
            animation: pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        /* Full-screen Intro GIF Overlay */
        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: #05080f;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #intro-gif {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #skip-intro-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            padding: 10px 18px;
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        #skip-intro-btn:hover {
            background: rgba(56, 189, 248, 0.22);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-[#0B1120] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-sky-500/30 selection:text-sky-200">
    <!-- Intro GIF Splash Screen -->
    <div id="intro-overlay">
        <img
            id="intro-gif"
            src="inv.mp4"
            alt="TIFT Intro Animation"
        />
        <button id="skip-intro-btn" type="button">SKIP INTRO &rarr;</button>
    </div>

    <!-- Minimalist Public Header -->
    <header class="border-b border-[#1E293B] bg-[#0B1120]/90 backdrop-blur-md sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between gap-4">
            <!-- Brand Identity -->
            <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center shadow-lg shadow-sky-500/20 shrink-0 overflow-hidden">
                    <img 
                        src="https://uploads.onecompiler.io/44n6r8jp7/1795015829900/0-02-05-a5afb4b2ee708a7328270b8a87dd4584172d317e45788848d3e5eb213af00343_420ff103f4ebd2b7.jpg"
                        alt="TIFT Logo"
                        class="w-full h-full object-cover"
                    >
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white font-mono leading-none">TIFT</h1>
                    <p class="text-xs text-slate-400 font-medium mt-1">The Invincible Fog Technology</p>
                </div>
            </div>

            <!-- Subtle Live Auto-Refresh Indicator -->
            <div class="flex items-center gap-2.5 bg-[#111827] px-3.5 py-2 rounded-xl border border-[#1E293B]">
                <span class="relative flex h-2.5 w-2.5 live-pulse">
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
                </span>
                <span class="text-xs font-mono font-semibold uppercase tracking-wider text-slate-300">Live Feed</span>
            </div>
        </div>
    </header>

    <!-- Driver-Facing Highway Cards Grid -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex flex-col justify-center">
        <section id="highway-grid" aria-label="Highway Fog Conditions" class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
            <!-- Highway cards are rendered here strictly showing: Highway Name, Fog Status, Humidity %, and Time -->
        </section>
    </main>

    <!-- Minimal Footer -->
    <footer class="border-t border-[#1E293B]/80 py-4 text-center text-xs text-slate-500 font-mono">
        TIFT &bull; Automated Highway Fog Telemetry
    </footer>
    <pre style="color: #858484; text-align: left; padding: 16px; max-width: 6xl; margin: 0 auto;"> By THE INVINCIBLES:
   Radislav Karaivanov
   Borislav Karaivanov
   Radoslav Iliev
   Daniel Nikolov
   Plamen Tsachev
   Nikita Petrochenko</pre>

    <script>
        /* ============================================================================
         * PROGRAMMER CONFIGURATION (ADAFRUIT IO INTEGRATION)
         * ============================================================================ */
        const PROGRAMMER_CONFIG = {
            POLL_INTERVAL_MS: 15000, // 15-second polling interval to prevent rate-limiting
            GIF_DURATION_MS: 9000,   // Close intro GIF after 9 seconds

            // Adafruit IO Authentication Headers (Updated Key)
            HEADERS: {
                'X-AIO-Key': 'aio_AgOW02bGGFVeZicHvm2NswgmSsAo',
                'Accept': 'application/json'
            },

            // Connected Highway Sensors via Adafruit IO feed 'humidity'
            HIGHWAYS: [
                {
                    name: 'АМ "Тракия"',
                    arduinoCloudUrl: 'https://io.adafruit.com/api/v2/Radkata90/feeds/humidity/data/last',
                    demoHumidity: 89 // Fallback demo value if offline
                }
            ]
        };

        // Cache to store last known good reading per highway so transient errors don't blank out the UI
        const lastKnownReadings = {};

        /* ============================================================================
         * FOG STATUS CALCULATION ENGINE
         * ============================================================================ */
        function calculateFogStatus(humidity) {
            const h = Number(humidity);
            if (!Number.isFinite(h)) {
                return {
                    label: 'OFFLINE',
                    badgeBg: 'bg-slate-800/80 text-slate-300 border-slate-700',
                    accentBorder: 'border-t-4 border-t-slate-600',
                    dotColor: 'bg-slate-400',
                    valueColor: 'text-slate-400'
                };
            }

            if (h < 30) {
                return {
                    label: 'CLEAR',
                    badgeBg: 'bg-emerald-500/15 text-[#10B981] border-emerald-500/40',
                    accentBorder: 'border-t-4 border-t-[#10B981]',
                    dotColor: 'bg-[#10B981]',
                    valueColor: 'text-[#10B981]'
                };
            }
            if (h <= 54) {
                return {
                    label: 'MIST RISK',
                    badgeBg: 'bg-sky-500/15 text-[#38BDF8] border-sky-500/40',
                    accentBorder: 'border-t-4 border-t-[#38BDF8]',
                    dotColor: 'bg-[#38BDF8]',
                    valueColor: 'text-[#38BDF8]'
                };
            }
            if (h <= 79) {
                return {
                    label: 'FOG LIKELY',
                    badgeBg: 'bg-amber-500/15 text-[#F59E0B] border-amber-500/40',
                    accentBorder: 'border-t-4 border-t-[#F59E0B]',
                    dotColor: 'bg-[#F59E0B]',
                    valueColor: 'text-[#F59E0B]'
                };
            }
            return {
                label: 'FOG',
                badgeBg: 'bg-red-500/15 text-[#EF4444] border-red-500/40',
                accentBorder: 'border-t-4 border-t-[#EF4444]',
                dotColor: 'bg-[#EF4444]',
                valueColor: 'text-[#EF4444]'
            };
        }

        /* ============================================================================
         * ADAFRUIT IO JSON PAYLOAD PARSER
         * ============================================================================ */
        function parseArduinoCloudPayload(data) {
            if (typeof data === 'number') {
                return { humidity: data, timestamp: new Date() };
            }
            if (typeof data === 'string' && !isNaN(parseFloat(data))) {
                return { humidity: parseFloat(data), timestamp: new Date() };
            }
            if (data && typeof data === 'object') {
                const item = Array.isArray(data) ? data[data.length - 1] : data;
                if (!item || typeof item !== 'object') {
                    return { humidity: null, timestamp: new Date() };
                }

                const rawVal =
                    item.value !== undefined ? item.value :
                    item.last_value !== undefined ? item.last_value :
                    item.humidity !== undefined ? item.humidity : null;

                const rawTime =
                    item.created_at ||
                    item.updated_at ||
                    item.timestamp ||
                    item.time;

                const parsedHumidity = rawVal !== null ? Number(rawVal) : null;
                const parsedTime = rawTime ? new Date(rawTime) : new Date();

                return {
                    humidity: Number.isFinite(parsedHumidity) ? parsedHumidity : null,
                    timestamp: isNaN(parsedTime.getTime()) ? new Date() : parsedTime
                };
            }
            return { humidity: null, timestamp: new Date() };
        }

        /* ============================================================================
         * FORMATTING & SECURITY HELPERS
         * ============================================================================ */
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function formatDisplayTime(dateObj) {
            if (!(dateObj instanceof Date) || isNaN(dateObj.getTime())) {
                return '--:--:--';
            }
            return dateObj.toLocaleString([], {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        /* ============================================================================
         * FETCH TELEMETRY FROM ADAFRUIT IO (WITH FALLBACK CACHE)
         * ============================================================================ */
        async function fetchHighwayTelemetry(highwayConfig) {
            const url = (highwayConfig.arduinoCloudUrl || '').trim();
            const isPlaceholder = !url || url.includes('YOUR_ARDUINO_CLOUD_URL');

            if (isPlaceholder) {
                const base = Number(highwayConfig.demoHumidity ?? 50);
                const jitter = (Math.random() - 0.5) * 0.8;
                const simulatedHumidity = Math.min(100, Math.max(0, Number((base + jitter).toFixed(1))));
                return {
                    name: highwayConfig.name,
                    humidity: simulatedHumidity,
                    timestamp: new Date()
                };
            }

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: PROGRAMMER_CONFIG.HEADERS,
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const contentType = response.headers.get('content-type') || '';
                const payload = contentType.includes('application/json')
                    ? await response.json()
                    : await response.text();

                const { humidity, timestamp } = parseArduinoCloudPayload(payload);

                if (humidity !== null && Number.isFinite(humidity)) {
                    lastKnownReadings[highwayConfig.name] = { humidity, timestamp };
                    return { name: highwayConfig.name, humidity, timestamp };
                } else {
                    throw new Error('Invalid humidity value parsed');
                }
            } catch (error) {
                console.warn(`[TIFT Notice] Temporary fetch glitch for "${highwayConfig.name}":`, error.message);
                
                if (lastKnownReadings[highwayConfig.name]) {
                    return {
                        name: highwayConfig.name,
                        humidity: lastKnownReadings[highwayConfig.name].humidity,
                        timestamp: lastKnownReadings[highwayConfig.name].timestamp
                    };
                }

                return {
                    name: highwayConfig.name,
                    humidity: null,
                    timestamp: new Date()
                };
            }
        }

        /* ============================================================================
         * RENDER CARDS
         * ============================================================================ */
        function renderHighwayCards(readings) {
            const grid = document.getElementById('highway-grid');
            if (!grid) return;

            if (readings.length === 1) {
                grid.classList.remove('md:grid-cols-2');
                grid.classList.add('max-w-2xl', 'mx-auto', 'w-full');
            }

            grid.innerHTML = readings.map(item => {
                const status = calculateFogStatus(item.humidity);
                const humidityDisplay = item.humidity !== null && Number.isFinite(item.humidity)
                    ? `${item.humidity.toFixed(1)}%`
                    : '--%';

                return `
                    <article class="bg-[#111827] border border-[#1E293B] ${status.accentBorder} rounded-2xl p-6 sm:p-8 shadow-2xl flex flex-col justify-between gap-6 transition-all">
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                            <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight leading-snug">
                                ${escapeHTML(item.name)}
                            </h2>

                            <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-mono font-extrabold tracking-wider border shrink-0 self-start ${status.badgeBg}">
                                <span class="w-2.5 h-2.5 rounded-full ${status.dotColor}"></span>
                                ${escapeHTML(status.label)}
                            </span>
                        </div>

                        <div class="bg-[#0B1120]/80 border border-[#1E293B] rounded-xl px-5 py-4 flex items-baseline justify-between">
                            <span class="text-xs font-semibold uppercase tracking-widest text-slate-400">Humidity</span>
                            <span class="text-4xl sm:text-5xl font-extrabold font-mono tabular-nums tracking-tight ${status.valueColor}">
                                ${escapeHTML(humidityDisplay)}
                            </span>
                        </div>

                        <div class="flex items-center justify-between text-xs sm:text-sm text-slate-400 font-mono pt-1 border-t border-[#1E293B]/70">
                            <span class="uppercase tracking-wider text-slate-500">Updated</span>
                            <time datetime="${item.timestamp.toISOString()}" class="text-slate-300 font-medium">
                                ${escapeHTML(formatDisplayTime(item.timestamp))}
                            </time>
                        </div>
                    </article>
                `;
            }).join('');
        }

        /* ============================================================================
         * INTRO GIF SPLASH SCREEN CONTROLLER & INITIALIZATION
         * ============================================================================ */
        document.addEventListener('DOMContentLoaded', () => {
            const introOverlay = document.getElementById('intro-overlay');
            const skipIntroBtn = document.getElementById('skip-intro-btn');

            function closeIntro() {
                if (!introOverlay) return;
                introOverlay.classList.add('fade-out');
                setTimeout(() => {
                    if (introOverlay.parentNode) {
                        introOverlay.remove();
                    }
                }, 650);
            }

            if (skipIntroBtn) {
                skipIntroBtn.addEventListener('click', closeIntro);
            }

            setTimeout(closeIntro, PROGRAMMER_CONFIG.GIF_DURATION_MS);

            refreshTelemetry();
            setInterval(refreshTelemetry, PROGRAMMER_CONFIG.POLL_INTERVAL_MS);
        });

        async function refreshTelemetry() {
            const results = await Promise.all(
                PROGRAMMER_CONFIG.HIGHWAYS.map(hw => fetchHighwayTelemetry(hw))
            );
            renderHighwayCards(results);
        }
    </script>
</body>
</html>
